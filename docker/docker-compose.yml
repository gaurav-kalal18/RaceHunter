services:
  postgres:
    image: postgres:17

    container_name: racehunter-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: racehunter
      POSTGRES_PASSWORD: racehunter123
      POSTGRES_DB: racehunter

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: